<!DOCTYPE html>
<html>

<head>
<title>Contact</title>

<style>

body{
background-color:blue;
text-align:center;
font-family:Arial;
color:white;
margin:0;
}

h1{
background:red;
padding:30px;
margin:0;
}

form{
margin-top:40px;
}

input,textarea{
width:300px;
padding:10px;
margin:10px;
font-size:16px;
}

button{
padding:10px 30px;
background:red;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

button:hover{
background:black;
}

</style>

</head>

<body>

<h1>Contact Spider-Man</h1>


<form>

<input type="text" placeholder="Your Name"><br>

<input type="email" placeholder="Your Email"><br>

<textarea rows="5" placeholder="Your Message"></textarea><br>

<button>Send</button>

</form>

</body>

</html>
